<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Flipbook</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
</head>
<body class="app-body">
  <main class="viewer-main">
    <section class="viewer-toolbar">
      <img
        class="brand-logo"
        src="https://res.cloudinary.com/dozcy2jve/image/upload/v1777494677/images/xxx_Panda_Buck_Playbook.pdf_1_i803ac.png"
        alt="Panda Buck Playbook"
      />
      <div class="page-status">
        <span id="page-indicator">Page 0 / 0</span>
      </div>
      <div class="page-controls">
        <button id="home-page" type="button" class="btn">Home</button>
        <button id="prev-page" type="button" class="btn">Prev</button>
        <label for="goto-page" class="sr-only">Go to page</label>
        <input id="goto-page" type="number" min="1" step="1" placeholder="Go to" />
        <label for="goto-select" class="sr-only">Go to page dropdown</label>
        <select id="goto-select" class="goto-select" aria-label="Go to page"></select>
        <label for="mobile-actions" class="sr-only">More actions</label>
        <select id="mobile-actions" class="mobile-actions" aria-label="More actions">
          <option value="">Menu</option>
          <option value="prev">Prev</option>
          <option value="go">Go</option>
          <option value="next">Next</option>
          <option value="zoomin">Zoom In</option>
          <option value="zoomout">Zoom Out</option>
          <option value="zoomreset">Reset Zoom</option>
          <option value="download">Download PDF</option>
          <option value="copy">Copy Link</option>
        </select>
        <button id="next-page" type="button" class="btn">Next</button>
        <button id="download-pdf" type="button" class="btn">Download PDF</button>
        <button id="share-page" type="button" class="btn">Copy Link</button>
      </div>
    </section>

    <section class="book-shell">
      <button id="edge-prev" type="button" class="edge-nav edge-nav-left" aria-label="Previous page">‹</button>
      <div id="flipbook"></div>
      <button id="edge-next" type="button" class="edge-nav edge-nav-right" aria-label="Next page">›</button>
    </section>
  </main>
  <p class="brand-watermark">ECLC FLIP BOOK 2026</p>

  <script src="./app.js"></script>
</body>
</html>
